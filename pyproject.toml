[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "vertex-batch-studio"
version = "0.1.0"
description = "Local Vertex AI image batch backend"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "pydantic>=2.9,<3",
  "Pillow>=10.4,<13",
  "google-genai>=1.30,<3",
  "google-cloud-storage>=2.18,<4",
  "google-auth>=2.35,<3",
  "httpx[socks]>=0.27,<1",
  "requests[socks]>=2.28,<3",
]

[project.optional-dependencies]
dev = []

[project.scripts]
vertex-batch = "backend.cli:main"

[tool.setuptools]
packages = ["backend"]
